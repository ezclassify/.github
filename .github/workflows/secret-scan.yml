name: Full-history secret scan

# Public and secretless: checkout deliberately selects the caller repository.
# Repositories retain their own event triggers, concurrency and required check.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks over full Git history
        shell: bash
        run: |
          set -euo pipefail
          # Keep downloaded tools out of the scanned checkout and clean them
          # on failure too. Repository gitleaks config/fingerprints still apply.
          tools="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          trap 'rm -rf "$tools"' EXIT
          curl -sSfL -o "$tools/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tools/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$tools/gitleaks.tar.gz" -C "$tools" gitleaks
          "$tools/gitleaks" git --no-banner --redact .
