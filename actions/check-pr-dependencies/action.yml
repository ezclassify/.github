name: Check upstream PR dependencies
description: Require declared upstream PRs to merge and optionally verify the producer snapshot.
inputs:
  producer:
    description: Official owner/repository for snapshot verification. Leave empty to check merge status only.
    default: ''
  packages:
    description: Space-separated package names from the producer.
    default: ''
  require-pins:
    description: Keep true for committed pins. Set false when the caller installs and verifies disposable exact pins.
    default: 'true'
  use-published-default:
    description: When no dependency is declared, verify and resolve the producer dev-snapshot package.
    default: 'false'
  manifest:
    description: Package manifest containing the exact dependency pins.
    default: package.json
  image:
    description: Development image name when checking an image instead of packages.
    default: ''
  publication-app-id:
    description: Numeric GitHub App ID authorized to report Release Train publication.
    default: ''
  token:
    description: Read-only GitHub token for the consumer PR and upstream PR metadata.
    required: true
  upstream-token:
    description: Optional read-only token from a trusted metadata job for upstream repositories.
    default: ''
outputs:
  version:
    description: Exact published snapshot version, or empty when no declared dependency or default applies.
    value: ${{ steps.resolve.outputs.version }}
  image:
    description: Verified immutable GHCR image reference when an image was requested.
    value: ${{ steps.resolve.outputs.image }}
runs:
  using: composite
  steps:
    - name: Check declared upstream pull requests
      id: resolve
      shell: bash
      env:
        DEPENDENCY_PRODUCER: ${{ inputs.producer }}
        DEPENDENCY_PACKAGES: ${{ inputs.packages }}
        DEPENDENCY_MANIFEST: ${{ inputs.manifest }}
        DEPENDENCY_REQUIRE_PINS: ${{ inputs.require-pins }}
        DEPENDENCY_USE_PUBLISHED_DEFAULT: ${{ inputs.use-published-default }}
        DEPENDENCY_IMAGE: ${{ inputs.image }}
        DEPENDENCY_PUBLICATION_APP_ID: ${{ inputs.publication-app-id }}
        DEPENDENCY_GITHUB_TOKEN: ${{ inputs.token }}
        DEPENDENCY_UPSTREAM_TOKEN: ${{ inputs.upstream-token }}
      run: node "$GITHUB_ACTION_PATH/check.mjs"
